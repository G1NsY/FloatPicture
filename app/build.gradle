apply plugin: 'com.android.application'

// Keep normal app support, while allowing a support screen without payment links.
// This switch is not a declaration of Google Play policy compliance.
def externalSupport = providers.gradleProperty('externalSupport').getOrElse('true')
if (!(externalSupport in ['true', 'false'])) {
    throw new GradleException('externalSupport must be true or false')
}

android {
    namespace "tool.xfy9326.floatpicture"
    compileSdk 36

    defaultConfig {
        applicationId 'tool.g1nsy.floatpicture'
        minSdkVersion 19
        targetSdkVersion 36
        versionCode 6
        versionName '2.0.5-beta'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'bool', 'support_external_enabled', externalSupport

        resourceConfigurations.add("zh")

        packaging {
            resources.excludes.addAll(
                    new String[]{
                            "META-INF/*.version",
                            "META-INF/CHANGES",
                            "META-INF/README.md",
                            "okhttp3/internal/publicsuffix/NOTICE",
                            "META-INF/DEPENDENCIES",
                            "META-INF/LICENSE",
                            "META-INF/LICENSE.txt",
                            "META-INF/license.txt",
                            "META-INF/NOTICE",
                            "META-INF/NOTICE.txt",
                            "META-INF/notice.txt",
                            "META-INF/ASL2.0",
                            "META-INF/INDEX.LIST"
                    }
            )
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            packaging {
                resources.excludes.add("DebugProbesKt.bin")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
